# airtap-sync 配置示例
#
# 默认位置：
#   Windows  %APPDATA%\airtap-sync\config.toml
#   Linux    ~/.config/airtap-sync/config.toml
# 也可以用 --config 指定：airtap-sync --config my.toml gitlab check
#
# 路径含反斜杠时请用单引号：'D:\work\docs'

side = "A"                        # 本机所在网络："A" 或 "B"
pair_id = "请替换为 init-usb 打印出的 pair_id"  # 仅做 gitlab check 时随便填非空即可

[transfer]                        # U 盘传输限额（都有默认值，可省略）
max_bytes = "28GiB"               # 单次最多写入 U 盘的数据量
reserve_free = "1GiB"             # U 盘上保留的空闲空间
part_size = "512MiB"              # 大文件切片大小

[agent]                           # 后台常驻程序（airtap-sync agent）
auto_sync = true                  # 检测到配对的 U 盘后自动开始同步；false 则先询问
poll_seconds = 3                  # 检测 U 盘的间隔

[gitlab]
url = "http://gitlab-a.example.com"   # 本网络 GitLab 的地址，不要带结尾的 /
# include_projects = ["zh/*"]         # 只同步这些工程（按完整路径的通配符）；留空表示全部
# exclude_projects = ["sandbox/*"]    # 不同步的工程；优先于 include_projects
# include_branches = []               # 只同步这些分支；留空表示全部
# exclude_branches = ["wip/*"]        # 不同步的分支
# ci_skip = true                      # 推送时附带 ci.skip，避免触发对方的 CI
# concurrency = 8                     # 并发检查工程的数量

[gitlab.cache]
dir = 'D:\airtap-cache'           # 本地仓库缓存目录（必填）
max_size = "100GiB"               # 缓存上限，超过后按最近最少使用淘汰

[safety]
max_deletions = 20                # 一次删除分支/tag 超过此数量时，转人工确认
max_new_projects = 20             # 一次新建工程超过此数量时，转人工确认

# 跨网电脑模式（airtap-sync relay）：在能同时访问两个网络的电脑上，直接在两个
# GitLab 之间同步 Git，不经过 U 盘。这台电脑可以没有 side、pair_id 和 [gitlab]。
# 两个地址都要用 airtap-sync gitlab login 保存令牌；筛选规则两边共用。
# 完整示例见 config-relay.example.toml。
# [relay]
# url_a = "http://gitlab-a.example.com"
# url_b = "http://gitlab-b.example.com"
# include_projects = ["ZH/*"]
# [relay.cache]
# dir = 'D:\airtap-relay-cache'
# max_size = "100GiB"

# 目录同步：每个 [folders.<名称>] 是一对要同步的目录，两端用相同的名称。
# 默认已忽略 .git/、~$*、*.tmp、Thumbs.db、desktop.ini；ignore 是额外的规则
# （gitignore 语法，两端规则取并集）。
# [folders.docs]
# path = 'D:\work\docs'
# ignore = ["build/", "*.log"]
