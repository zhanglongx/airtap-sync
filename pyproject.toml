[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airtap-sync"
version = "0.1.0"
description = "Sync directories and Git repositories between two air-gapped networks via USB drive."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "keyring>=25.0",
    "pathspec>=0.12",
    "platformdirs>=4.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Tray icon and notifications for the background agent (tkinter ships with Python).
tray = [
    "pystray>=0.19",
    "Pillow>=10.0",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/zhanglongx/airtap-sync"

[project.scripts]
airtap-sync = "airtap_sync.cli:main"

[project.gui-scripts]
airtap-sync-agent = "airtap_sync.agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
